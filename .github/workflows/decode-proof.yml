name: Decode proof PNGs
on:
  push:
    paths:
      - "payloads/*.b64"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and commit PNGs
        run: |
          set -euo pipefail
          for f in payloads/*.b64; do
            name=$(basename "$f" .b64)
            base64 -d "$f" > "$name"
            python3 -c "import pathlib,sys; b=pathlib.Path(sys.argv[1]).read_bytes()[:8]; assert b==b'\\x89PNG\\r\\n\\x1a\\n'" "$name"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          if git diff --cached --quiet; then
            echo "no png changes"
            exit 0
          fi
          git commit -m "Add decoded Today proof PNGs"
          git push
