name: Decode proof PNGs
on:
  push:
    paths:
      - "payloads/**"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch complete payloads, decode, commit
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import base64, hashlib, json, urllib.request
          payloads = Path('payloads')
          src = payloads / 'perform-sources.json'
          expected = {}
          if src.exists():
              items = json.loads(src.read_text())
              for it in items:
                  name, url, sha = it['name'], it['url'], it['sha256']
                  expected[name] = sha
                  req = urllib.request.Request(url, headers={'User-Agent': 'insp1re-pr1-proof'})
                  raw = urllib.request.urlopen(req, timeout=60).read()
                  got = hashlib.sha256(raw).hexdigest()
                  if got != sha:
                      raise SystemExit(f'fetch hash mismatch {name} {got}')
                  out_b64 = payloads / f'perform-{name}.b64'
                  out_b64.write_text(base64.b64encode(raw).decode('ascii'))
                  print('wrote payload', out_b64, len(raw))
          groups = {}
          for p in sorted(payloads.glob('*')):
              if not p.is_file():
                  continue
              n = p.name
              if n.endswith('.png.b64') and '.png.b64.part' not in n:
                  groups.setdefault(n, []).append(p)
              elif '.png.b64.part' in n:
                  stem = n.split('.part')[0]
                  groups.setdefault(stem, []).append(p)
          magic = bytes([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A])
          wrote = []
          for stem, files in groups.items():
              if not stem.endswith('.png.b64') or not stem.startswith('perform-'):
                  continue
              png_name = stem[len('perform-'):-4]
              data = ''.join(f.read_text().strip() for f in files)
              try:
                  raw = base64.b64decode(data, validate=False)
              except Exception as e:
                  print('skip decode', png_name, e)
                  continue
              if raw[:8] != magic:
                  print('skip incomplete', png_name, raw[:8])
                  continue
              if png_name in expected:
                  got = hashlib.sha256(raw).hexdigest()
                  if got != expected[png_name]:
                      print('skip hash mismatch', png_name, got)
                      continue
              dest_dir = Path('2026-09-01/perform')
              dest_dir.mkdir(parents=True, exist_ok=True)
              out = dest_dir / png_name
              out.write_bytes(raw)
              wrote.append(str(out))
              print('decoded', out, len(raw))
          if not wrote:
              print('nothing complete yet')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payloads/perform-*.png.b64
          if ! git diff --cached --quiet; then
            git commit -m "Add Perform proof payloads for 2026-09-01"
          fi
          git add 2026-09-01/perform || true
          if ! git diff --cached --quiet; then
            git commit -m "Add decoded Perform proof PNGs"
          else
            echo "no png changes"
          fi
          git push
